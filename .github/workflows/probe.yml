# Manual check: fetches one of the app's URLs from GitHub's servers and prints the answer to the log.
name: Probe
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path on the live app or a full https URL (prefix raw for script URLs, head for cache headers)"
        required: true
      grep:
        description: For zip files, a pattern to pick rows (case-insensitive)
        required: false
        default: ''
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          P="${{ inputs.path }}"; RAW="";
          if [ "${P#head:}" != "$P" ]; then P="${P#head:}"; U="$P"; [ "${P#http}" = "$P" ] && U="https://watch-dawg-78h1.vercel.app$P"; for i in 1 2 3; do curl -s -o /dev/null -D - "$U" | grep -i "x-vercel-cache\|^age\|cdn-cache\|x-vercel-id"; echo --; sleep 2; done; exit 0; fi
          case "$P" in raw:*) RAW=1; P="${P#raw:}";; esac
          case "$P" in http*) U="$P";; *) U="https://watch-dawg-78h1.vercel.app$P";; esac
          curl -sL -m 60 "$U" > /tmp/out
          if head -c 2 /tmp/out | grep -q "PK"; then mkdir -p /tmp/z && cd /tmp/z && unzip -o -q /tmp/out && for f in *; do echo "== $f ($(wc -l < "$f") rows)"; head -1 "$f"; [ -n "${{ inputs.grep }}" ] && grep -i -E "${{ inputs.grep }}" "$f" | head -40; done; exit 0; fi
          if [ -n "$RAW" ]; then grep -o "[^\"' ]*\(api\|json\|csv\|\.js\)[^\"' ]*" /tmp/out | sort -u | head -80; head -c 6000 /tmp/out; exit 0; fi
          case "$(head -c 200 /tmp/out)" in *"<html"*|*"<!DOCTYPE"*) echo "(page text, tags removed)"; sed -e "s/<script[^>]*>.*<\/script>//g" /tmp/out | tr "\n" " " | sed -e "s/<[^>]*>/ /g" -e "s/  */ /g" | head -c 30000;; *) head -c 20000 /tmp/out; echo; echo "---TAIL---"; tail -c 1500 /tmp/out;; esac
