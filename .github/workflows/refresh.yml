name: Refresh data
on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes (GitHub may run a few minutes late)
  workflow_dispatch:
    inputs:
      fast:
        description: Quick pass only (rates, odds, today's CDS trades)
        type: boolean
        default: false
concurrency:
  group: refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out the data branch
        run: |
          git fetch origin data --depth=1 && git worktree add data-branch origin/data && (cd data-branch && git switch -c data) \
            || (git worktree add --detach data-branch && cd data-branch && git switch --orphan data && git rm -rfq . || true)
      # one full refresh, then quick passes (rates, odds, today's CDS trades) every 15 minutes until the next run
      # is due: GitHub often starts scheduled runs an hour or more apart, so this keeps the figures fresh anyway
      - name: Refresh
        run: |
          save() {
            (cd data-branch && git config user.name "watchdawg-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
              && git add -A && { git diff --cached --quiet || { git commit -qm "Data refresh $(date -u +%FT%TZ)$1" && git push -q origin data; }; })
          }
          if [ "${{ inputs.fast }}" = "true" ]; then FAST=1 node scripts/refresh.mjs data-branch; save " (quick)"; exit 0; fi
          node scripts/refresh.mjs data-branch; save ""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            for i in 1 2 3; do sleep 840; FAST=1 node scripts/refresh.mjs data-branch || true; save " (quick)"; done
          fi
